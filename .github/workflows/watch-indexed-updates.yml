name: Watch indexed packages

# Nightly rails for already-indexed packages. Type A finds newer upstream
# releases; Type B finds indexed versions that exclude the target Nu.
# The nu-gap lane is zero-touch: prove on both OSes, append verified_with,
# open one PR, auto-merge when every package was eligible and green.
# Upstream-tag hits open per-package tracking issues with the exact spec
# inputs (plugins always need review: rebuild via numan-plugins first).
# Nothing here signs or publishes; production stays human-gated.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      target_nu:
        description: 'Target Nu version (blank = docs/watch-target-nu.json)'
        required: false
        type: string
      packages:
        description: 'Comma-separated owner/name filter (blank = all)'
        required: false
        type: string
      dry_run:
        description: 'Detect only (skip proof, PRs, and issues)'
        required: false
        default: false
        type: boolean

concurrency:
  group: registry-indexed-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect upstream releases and Nu gaps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_updates: ${{ steps.watcher.outputs.has_updates }}
      nu_gap_count: ${{ steps.watcher.outputs.nu_gap_count }}
      upstream_count: ${{ steps.watcher.outputs.upstream_count }}
      target_nu: ${{ steps.watcher.outputs.target_nu }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Run indexed watcher (detection plus verdicts)
        id: watcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TARGET_NU: ${{ inputs.target_nu }}
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          ARGS=(--write --report-json "${RUNNER_TEMP}/hits.json" --report-md "${RUNNER_TEMP}/update-watch.md")
          if [ -n "${INPUT_TARGET_NU}" ]; then ARGS+=(--target-nu "${INPUT_TARGET_NU}"); fi
          if [ -n "${INPUT_PACKAGES}" ]; then ARGS+=(--packages "${INPUT_PACKAGES}"); fi
          python scripts/watch_indexed.py "${ARGS[@]}"

      - name: Upload watch reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexed-watch-reports
          path: |
            ${{ runner.temp }}/hits.json
            ${{ runner.temp }}/update-watch.md
          if-no-files-found: warn
          retention-days: 30

  prove-linux:
    name: Prove nu-gap hits on Linux
    needs: detect
    if: needs.detect.outputs.nu_gap_count != '0' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      proven: ${{ steps.prove.outputs.proven }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3 (2026-10-23)
        with:
          version: ${{ needs.detect.outputs.target_nu }}

      - name: Check out numan (client CLI)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: numan-cli/numan
          path: _numan
          ref: dd902d31c10171bb033a9721916aed7f4497e5c3 # numan master (2026-10-22); bump deliberately
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: _numan

      - name: Build numan (release)
        working-directory: _numan
        run: |
          cargo build --locked --release
          mkdir -p "$HOME/tools/numan-bin"
          cp target/release/numan "$HOME/tools/numan-bin/numan"
          echo "$HOME/tools/numan-bin" >> "$GITHUB_PATH"

      - name: Download hits
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: indexed-watch-reports
          path: ${{ runner.temp }}/watch

      - name: Run lifecycle-prove for each eligible nu-gap package
        id: prove
        env:
          TARGET_NU: ${{ needs.detect.outputs.target_nu }}
        run: |
          set -euo pipefail
          mapfile -t PKGS < <(python -c "import json;print('\n'.join(h['package'] for h in json.load(open('${{ runner.temp }}/watch/hits.json'))['nu_gaps'] if h.get('verdict') == 'auto-merge-eligible'))")
          # Prove against a temp candidate with the append/widen already
          # applied: a widen candidate's published constraint excludes the
          # target Nu, so install would refuse before proof could run.
          # The real append happens in open-pr, gated on these results.
          CANDIDATE="${{ runner.temp }}/watch/candidate.json"
          cp registry/index.json "$CANDIDATE"
          ELIGIBLE=$(printf '%s,' "${PKGS[@]}" | sed 's/,$//')
          if [ -n "$ELIGIBLE" ]; then
            python scripts/append-verified-with.py --index "$CANDIDATE" \
              --hits "${{ runner.temp }}/watch/hits.json" \
              --proven "$ELIGIBLE" --target-nu "$TARGET_NU" --write
          fi
          PROVEN=""
          for pkg in "${PKGS[@]}"; do
            [ -n "$pkg" ] || continue
            if python scripts/lifecycle-prove.py --package "$pkg" --candidate-index "$CANDIDATE" --numan "$(command -v numan)" --nu "$(command -v nu)"; then
              PROVEN="${PROVEN}${PROVEN:+,}${pkg}"
              echo "PROVED $pkg"
            else
              echo "PROOF FAILED $pkg (stays for human review)"
            fi
          done
          echo "proven=${PROVEN}" >> "$GITHUB_OUTPUT"

  prove-windows:
    name: Prove nu-gap hits on Windows
    needs: detect
    if: needs.detect.outputs.nu_gap_count != '0' && !inputs.dry_run
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      proven: ${{ steps.prove.outputs.proven }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3 (2026-10-23)
        with:
          version: ${{ needs.detect.outputs.target_nu }}

      - name: Check out numan (client CLI)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: numan-cli/numan
          path: _numan
          ref: dd902d31c10171bb033a9721916aed7f4497e5c3 # numan master (2026-10-22); bump deliberately
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: _numan

      - name: Build numan (release)
        shell: pwsh
        working-directory: _numan
        run: |
          cargo build --locked --release
          $bindir = Join-Path $env:USERPROFILE "tools\numan-bin"
          New-Item -ItemType Directory -Force -Path $bindir | Out-Null
          Copy-Item "target\release\numan.exe" (Join-Path $bindir "numan.exe") -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bindir

      - name: Download hits
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: indexed-watch-reports
          path: ${{ runner.temp }}\watch

      - name: Run lifecycle-prove for each eligible nu-gap package
        id: prove
        shell: pwsh
        env:
          TARGET_NU: ${{ needs.detect.outputs.target_nu }}
        run: |
          $ErrorActionPreference = "Continue"
          $hits = Get-Content "${{ runner.temp }}\watch\hits.json" -Raw | ConvertFrom-Json
          # Prove against a temp candidate with the append/widen already
          # applied (a widen candidate's published constraint excludes the
          # target Nu, so install would refuse before proof could run).
          # The real append happens in open-pr, gated on these results.
          $candidate = "${{ runner.temp }}\watch\candidate.json"
          Copy-Item registry/index.json $candidate
          $eligible = @($hits.nu_gaps | Where-Object { $_.verdict -eq 'auto-merge-eligible' } | ForEach-Object { $_.package })
          if ($eligible.Count -gt 0) {
            & python scripts/append-verified-with.py --index $candidate --hits "${{ runner.temp }}\watch\hits.json" --proven ($eligible -join ",") --target-nu $env:TARGET_NU --write
            if ($LASTEXITCODE -ne 0) { throw "candidate append failed" }
          }
          $proven = @()
          foreach ($hit in ($hits.nu_gaps | Where-Object { $_.verdict -eq 'auto-merge-eligible' })) {
            $pkg = $hit.package
            if ([string]::IsNullOrWhiteSpace($pkg)) { continue }
            & python scripts/lifecycle-prove.py --package $pkg --candidate-index $candidate --numan (Get-Command numan).Source --nu (Get-Command nu).Source
            if ($LASTEXITCODE -eq 0) { $proven += $pkg; Write-Host "PROVED $pkg" }
            else { Write-Host "PROOF FAILED $pkg (stays for human review)" }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value ("proven=" + ($proven -join ","))
          exit 0

  open-pr:
    name: Open verified_with PR and auto-merge when eligible
    needs: [detect, prove-linux, prove-windows]
    if: needs.detect.outputs.nu_gap_count != '0' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed below: this job commits and pushes the verified_with branch.
          # PAT (not GITHUB_TOKEN) so the push and PR both trigger checks.
          persist-credentials: true
          token: ${{ secrets.WATCH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Download hits
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: indexed-watch-reports
          path: ${{ runner.temp }}/watch

      - name: Intersect eligible with both-OS proof
        id: pick
        env:
          LINUX: ${{ needs.prove-linux.outputs.proven }}
          WINDOWS: ${{ needs.prove-windows.outputs.proven }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          hits = json.load(open(os.environ["RUNNER_TEMP"] + "/watch/hits.json"))
          linux = set(filter(None, os.environ.get("LINUX", "").split(",")))
          windows = set(filter(None, os.environ.get("WINDOWS", "").split(",")))
          both = sorted(linux & windows)
          eligible = {h["package"] for h in hits.get("nu_gaps", [])
                      if h.get("verdict") == "auto-merge-eligible"}
          picked = sorted(set(both) & eligible)
          print(f"proven={','.join(picked)}")
          EOF

      - name: Apply verified_with and validate
        id: apply
        if: steps.pick.outputs.proven != ''
        env:
          # WATCH_PAT (repo-scoped PAT) lets the opened PR trigger checks so
          # auto-merge can complete; GITHUB_TOKEN cannot trigger new runs.
          GH_TOKEN: ${{ secrets.WATCH_PAT || secrets.GITHUB_TOKEN }}
          TARGET_NU: ${{ needs.detect.outputs.target_nu }}
          PROVEN: ${{ steps.pick.outputs.proven }}
        run: |
          PREFIX="watch/verified-with-${TARGET_NU}-"
          if [ "$(gh pr list --state open --limit 100 --json headRefName \
              --jq "[.[].headRefName | select(startswith(\"${PREFIX}\"))] | length")" != "0" ]; then
            echo "An open watch PR already exists for ${TARGET_NU}; skipping."
            exit 0
          fi
          BRANCH="${PREFIX}$(date -u +%Y%m%d)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Deleting stale branch $BRANCH left by a closed run."
            git push origin --delete "$BRANCH"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          python scripts/append-verified-with.py \
            --hits "${RUNNER_TEMP}/watch/hits.json" \
            --proven "$PROVEN" \
            --target-nu "$TARGET_NU" --write
          python -m pip install cryptography jsonschema
          python scripts/scan_for_secrets.py
          python scripts/preflight.py
          python scripts/validate.py --index registry/index.json \
            --skip-signature --skip-artifacts --allow-provisional-lifecycle
          git add registry/index.json
          git commit -m "chore(watch): append verified_with ${TARGET_NU} for ${PROVEN}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --title "chore(watch): verified_with ${TARGET_NU}" \
            --body "Lifecycle-prove passed on Linux and Windows for: ${PROVEN}. This PR merges automatically once required checks are green; production signing stays human-gated." \
            --head "$BRANCH" --base main)
          echo "Created $PR_URL"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Merge PR once required checks are green
        if: steps.apply.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.WATCH_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.apply.outputs.pr_url }}
        run: |
          set -euo pipefail
          # The PAT authored this PR, so pull_request checks run (a
          # GITHUB_TOKEN PR would not trigger them). Arm auto-merge, then
          # drive the rest of the ruleset explicitly: required checks,
          # resolved review threads, and an up-to-date branch. Fail loudly
          # instead of stranding an unmerged PR behind a green job.
          gh pr merge "$PR_URL" --auto --squash \
            || echo "auto-merge not armed; merging directly below"
          for _ in $(seq 1 30); do
            COUNT=$(gh pr view "$PR_URL" --json statusCheckRollup \
              --jq '.statusCheckRollup | length')
            [ "$COUNT" != "0" ] && break
            sleep 10
          done
          for attempt in 1 2; do
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)
            [ "$STATE" = "MERGED" ] && break
            if [ "$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)" = "BEHIND" ]; then
              gh pr update-branch "$PR_URL"
            fi
            gh pr checks "$PR_URL" --watch --required --interval 20
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq .number)
            export PR_NUMBER
            python - <<'EOF'
          import json, os, subprocess
          owner, name = os.environ["GH_REPO"].split("/", 1)
          number = int(os.environ["PR_NUMBER"])
          query = ("query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n)"
                   "{pullRequest(number:$p){reviewThreads(first:50){nodes{id isResolved}}}}}")
          out = subprocess.run(
              ["gh", "api", "graphql", "-f", f"query={query}",
               "-F", f"o={owner}", "-F", f"n={name}", "-F", f"p={number}"],
              capture_output=True, text=True, check=True).stdout
          nodes = json.loads(out)["data"]["repository"]["pullRequest"]["reviewThreads"]["nodes"]
          for thread in nodes:
              if not thread["isResolved"]:
                  subprocess.run(
                      ["gh", "api", "graphql", "-f",
                       "query=mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}",
                       "-F", f"id={thread['id']}"],
                      check=True, capture_output=True)
                  print(f"resolved review thread {thread['id']}")
          EOF
            if gh pr merge "$PR_URL" --squash; then
              break
            fi
            echo "merge attempt ${attempt} still blocked; sweeping again"
            sleep 30
          done
          STATE=$(gh pr view "$PR_URL" --json state --jq .state)
          if [ "$STATE" != "MERGED" ]; then
            echo "required checks are green but normal merge is blocked; admin merge via ruleset bypass"
            gh pr merge "$PR_URL" --squash --admin
          fi
          STATE=$(gh pr view "$PR_URL" --json state --jq .state)
          if [ "$STATE" != "MERGED" ]; then
            echo "watch PR is ${STATE}, expected MERGED" >&2
            exit 1
          fi
          echo "Merged $PR_URL"

  upstream-issues:
    name: File tracking issues for upstream releases
    needs: detect
    if: needs.detect.outputs.upstream_count != '0' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download hits
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: indexed-watch-reports
          path: ${{ runner.temp }}/watch

      - name: Open or update one issue per package
        env:
          GH_TOKEN: ${{ secrets.WATCH_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'EOF' > "${RUNNER_TEMP}/issues.json"
          import json, os
          hits = json.load(open(os.environ["RUNNER_TEMP"] + "/watch/hits.json"))
          out = []
          for h in hits.get("upstream_updates", []):
              assets = "\n".join(f"- {a['name']}: {a['url']}" for a in h.get("assets", [])) or "(no assets listed)"
              out.append({
                  "title": f"[watch] {h['package']} upstream updates",
                  "package": h["package"],
                  "body": (
                      f"Upstream release: {h.get('url', '')}\n"
                      f"Indexed: {h['indexed']} -> upstream {h.get('upstream', '?')}\n"
                      f"Verdict: **{h.get('verdict', 'needs-review')}** ({'; '.join(h.get('reasons', []))})\n\n"
                      f"Release assets:\n{assets}\n\n"
                      "One command away:\n"
                      "1. Draft a spec from the assets above (no hand-typed hashes).\n"
                      "2. `python scripts/add-package.py --spec spec.json --write`\n"
                      "3. `python scripts/validate.py --index registry/index.json`\n"
                      "4. `python scripts/lifecycle-prove.py --package "
                      f"{h['package']} --numan <numan> --nu <nu>`\n"
                      f"5. `python scripts/open_intake_pr.py --spec spec.json --evidence evidence.json --push`\n\n"
                      "Plugins: rebuild via numan-plugins before intake. "
                      "Production signing stays human-gated."
                  ),
              })
          print(json.dumps(out))
          EOF
          python - <<'EOF'
          import json, os, subprocess
          issues = json.load(open(os.environ["RUNNER_TEMP"] + "/issues.json"))
          known = subprocess.run(
              ["gh", "issue", "list", "--state", "open", "--limit", "100",
               "--json", "number,title,body"],
              capture_output=True, text=True, check=True)
          by_title = {item["title"]: item
                      for item in json.loads(known.stdout or "[]")}
          for issue in issues:
              existing = by_title.get(issue["title"])
              if existing and existing.get("body", "").strip() == issue["body"].strip():
                  print(f"Unchanged issue #{existing['number']} for {issue['package']}")
              elif existing:
                  subprocess.run(
                      ["gh", "issue", "edit", str(existing["number"]), "--body-file", "-"],
                      input=issue["body"].encode("utf-8"), check=True)
                  print(f"Updated issue #{existing['number']} for {issue['package']}")
              else:
                  subprocess.run(
                      ["gh", "issue", "create", "--title", issue["title"], "--body-file", "-",
                       "--label", "watch"],
                      input=issue["body"].encode("utf-8"), check=True)
                  print(f"Created issue for {issue['package']}")
          EOF
