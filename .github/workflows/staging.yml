name: Staging registry

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: registry-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography jsonschema
      - name: Merge provisional candidates for staging only
        run: |
          python scripts/prepare-staging.py --output "${RUNNER_TEMP}/staging-index.json"
          python -c "import os, shutil; shutil.copyfile(os.path.join(os.environ['RUNNER_TEMP'], 'staging-index.json'), 'registry/index.json')"
      - name: Generate ephemeral key, sign, and validate staging candidate
        shell: bash
        run: |
          STAGING_PUB="${RUNNER_TEMP}/staging-key.pub.json"
          trap 'rm -f "${STAGING_PUB}"' EXIT
          read -r STAGING_PRIVATE_KEY STAGING_PUBLIC_KEY < <(python -c 'import base64; from cryptography.hazmat.primitives import serialization; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; key = Ed25519PrivateKey.generate(); public = key.public_key(); print(base64.b64encode(key.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption())).decode(), base64.b64encode(public.public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)).decode())')
          if [ -z "${STAGING_PRIVATE_KEY}" ] || [ -z "${STAGING_PUBLIC_KEY}" ]; then
            echo "FAIL: ephemeral staging key generation failed"
            exit 1
          fi
          export STAGING_PRIVATE_KEY
          echo "::add-mask::${STAGING_PRIVATE_KEY}"
          python scripts/ci-sign.py --index registry/index.json --sig registry/index.json.sig --key-id staging-ephemeral --priv-b64 "${STAGING_PRIVATE_KEY}"
          unset STAGING_PRIVATE_KEY
          printf '{"key_id":"staging-ephemeral","public_key_b64":"%s"}' "${STAGING_PUBLIC_KEY}" > "${STAGING_PUB}"
          python scripts/validate.py --index registry/index.json --sig registry/index.json.sig --pub "${STAGING_PUB}" --schema schemas/index-v1.json --skip-artifacts --allow-provisional-lifecycle
      - name: Record public site publication metadata
        run: python scripts/write_site_metadata.py --environment staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: staging-registry
          path: registry
          if-no-files-found: error

  publish:
    name: Publish staging registry
    needs: validate
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      # Required only for actions-gh-pages to publish gh-pages/staging.
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-registry
          path: staged-registry
      - uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./staged-registry
          destination_dir: staging
          keep_files: false
