name: Reusable lifecycle proof

on:
  workflow_call:
    inputs:
      package:
        description: Package id (owner/name)
        required: false
        type: string
        default: JosephTLyons/nu_plugin_units
      package_version:
        description: Exact package version
        required: false
        type: string
        default: 0.1.9
      nu_version:
        description: Exact Nu version
        required: false
        type: string
        default: 0.116.1
      targets:
        description: JSON array of os/arch targets
        required: false
        type: string
        default: '["linux/aarch64","macos/aarch64"]'
      artifact_prefix:
        description: Artifact name prefix; keep parallel proof calls distinct
        required: false
        type: string
        default: lifecycle-proof
      artifact_summary_prefix:
        description: Summary artifact name; defaults to the historical lifecycle-proofs name
        required: false
        type: string
        default: lifecycle-proofs
      activation_kind:
        description: Optional activation kind; inferred when empty
        required: false
        type: string
        default: ""
      commands:
        description: Optional JSON array of lifecycle commands; derived from kind when empty
        required: false
        type: string
        default: ""
      numan_version:
        description: Numan release tag without the v prefix
        required: false
        type: string
        default: 0.4.0
      numan_repo:
        description: Numan source repository
        required: false
        type: string
        default: numan-cli/numan
      registry_repository:
        description: Repository to check out as the registry; empty uses the caller checkout
        required: false
        type: string
        default: ""
      registry_ref:
        description: Exact ref or commit SHA to check out from registry_repository
        required: false
        type: string
        default: ""
      registry_checkout:
        description: Workspace-relative path for the explicit registry checkout
        required: false
        type: string
        default: "."
    outputs:
      proofs:
        description: JSON array of proof records emitted by the run
        value: ${{ jobs.collect.outputs.proofs }}
  workflow_dispatch:
    inputs:
      package:
        description: Package id (owner/name)
        required: true
        default: JosephTLyons/nu_plugin_units
        type: string
      package_version:
        description: Exact package version
        required: true
        default: 0.1.9
        type: string
      nu_version:
        description: Exact Nu version
        required: true
        default: 0.116.1
        type: string
      targets:
        description: JSON array of os/arch targets
        required: true
        default: '["linux/aarch64","macos/aarch64"]'
        type: string
      artifact_prefix:
        description: Artifact name prefix; keep parallel proof calls distinct
        required: false
        default: lifecycle-proof
        type: string
      artifact_summary_prefix:
        description: Summary artifact name; defaults to the historical lifecycle-proofs name
        required: false
        default: lifecycle-proofs
        type: string
      activation_kind:
        description: Optional activation kind; inferred when empty
        required: false
        default: ""
        type: string
      commands:
        description: Optional JSON array of lifecycle commands; derived from kind when empty
        required: false
        default: ""
        type: string
      numan_version:
        description: Numan release tag without the v prefix
        required: true
        default: 0.4.0
        type: string
      numan_repo:
        description: Numan source repository
        required: true
        default: numan-cli/numan
        type: string
      registry_repository:
        description: Repository to check out as the registry; empty uses the caller checkout
        required: false
        default: ""
        type: string
      registry_ref:
        description: Exact ref or commit SHA to check out from registry_repository
        required: false
        default: ""
        type: string
      registry_checkout:
        description: Workspace-relative path for the explicit registry checkout
        required: false
        default: "."
        type: string
  pull_request:
    paths:
      - ".github/workflows/lifecycle-proof.yml"
      - "requirements/lifecycle-proof.txt"
      - "scripts/lifecycle-prove.py"
      - "scripts/lifecycle_proof_plan.py"
      - "scripts/lifecycle_proof_record.py"
      - "scripts/lifecycle_proof_collect.py"
      - "scripts/nu_version_constraint.py"

permissions:
  contents: read

concurrency:
  group: lifecycle-proof-${{ github.ref }}-${{ inputs.artifact_prefix || github.event.inputs.artifact_prefix || 'lifecycle-proof' }}
  cancel-in-progress: false

env:
  PROOF_PACKAGE: ${{ inputs.package || github.event.inputs.package || 'JosephTLyons/nu_plugin_units' }}
  PROOF_PACKAGE_VERSION: ${{ inputs.package_version || github.event.inputs.package_version || '0.1.9' }}
  PROOF_NU_VERSION: ${{ inputs.nu_version || github.event.inputs.nu_version || '0.116.1' }}
  PROOF_TARGETS: ${{ inputs.targets || github.event.inputs.targets || '["linux/aarch64","macos/aarch64"]' }}
  PROOF_ARTIFACT_PREFIX: ${{ inputs.artifact_prefix || github.event.inputs.artifact_prefix || 'lifecycle-proof' }}
  PROOF_SUMMARY_ARTIFACT: ${{ inputs.artifact_summary_prefix || github.event.inputs.artifact_summary_prefix || 'lifecycle-proofs' }}
  PROOF_ACTIVATION_KIND: ${{ inputs.activation_kind || github.event.inputs.activation_kind || '' }}
  PROOF_COMMANDS: ${{ inputs.commands || github.event.inputs.commands || '' }}
  PROOF_NUMAN_VERSION: ${{ inputs.numan_version || github.event.inputs.numan_version || '0.4.0' }}
  PROOF_NUMAN_REPO: ${{ inputs.numan_repo || github.event.inputs.numan_repo || 'numan-cli/numan' }}
  PROOF_REGISTRY_REPOSITORY: ${{ inputs.registry_repository || github.event.inputs.registry_repository || '' }}
  PROOF_REGISTRY_REF: ${{ inputs.registry_ref || github.event.inputs.registry_ref || '' }}
  PROOF_REGISTRY_CHECKOUT: ${{ inputs.registry_checkout || github.event.inputs.registry_checkout || '.' }}
  PROOF_ARTIFACTS: ${{ format('{0}/artifacts', inputs.registry_checkout || github.event.inputs.registry_checkout || '.') }}

jobs:
  plan:
    name: Resolve proof plan
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.plan.outputs.package }}
      package_version: ${{ steps.plan.outputs.package_version }}
      nu_version: ${{ steps.plan.outputs.nu_version }}
      activation_kind: ${{ steps.plan.outputs.activation_kind }}
      commands: ${{ steps.plan.outputs.commands }}
      matrix: ${{ steps.plan.outputs.matrix }}
      numan_version: ${{ steps.plan.outputs.numan_version }}
      numan_repo: ${{ steps.plan.outputs.numan_repo }}
    steps:
      - name: Validate explicit registry checkout
        if: env.PROOF_REGISTRY_REPOSITORY != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROOF_REGISTRY_REF}" ]; then
            echo "error: registry_ref is required when registry_repository is set" >&2
            exit 1
          fi
          case "${PROOF_REGISTRY_CHECKOUT}" in
            ""|..|/*|../*|*/..|*/../*)
              echo "error: registry_checkout must be a non-empty workspace-relative path" >&2
              exit 1
              ;;
          esac
      - name: Check out registry (external)
        if: env.PROOF_REGISTRY_REPOSITORY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROOF_REGISTRY_REPOSITORY }}
          ref: ${{ env.PROOF_REGISTRY_REF }}
          path: ${{ env.PROOF_REGISTRY_CHECKOUT }}
          persist-credentials: false
      - name: Check out caller repository
        if: env.PROOF_REGISTRY_REPOSITORY == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.PROOF_REGISTRY_CHECKOUT }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Resolve package, commands, and target matrix
        id: plan
        shell: bash
        working-directory: ${{ env.PROOF_REGISTRY_CHECKOUT }}
        run: |
          set -euo pipefail
          python scripts/lifecycle_proof_plan.py \
            --package "${PROOF_PACKAGE}" \
            --package-version "${PROOF_PACKAGE_VERSION}" \
            --nu-version "${PROOF_NU_VERSION}" \
            --targets "${PROOF_TARGETS}" \
            --activation-kind "${PROOF_ACTIVATION_KIND}" \
            --commands "${PROOF_COMMANDS}" \
            --numan-version "${PROOF_NUMAN_VERSION}" \
            --numan-repo "${PROOF_NUMAN_REPO}" \
            --index registry/index.json \
            --github-output "${GITHUB_OUTPUT}"

  prove:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PACKAGE: ${{ needs.plan.outputs.package }}
      PACKAGE_VERSION: ${{ needs.plan.outputs.package_version }}
      NU_VERSION: ${{ needs.plan.outputs.nu_version }}
      COMMANDS_JSON: ${{ needs.plan.outputs.commands }}
      NUMAN_VERSION: ${{ needs.plan.outputs.numan_version }}
      NUMAN_REPO: ${{ needs.plan.outputs.numan_repo }}
      TARGET_LABEL: ${{ matrix.label }}
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_TRIPLE: ${{ matrix.triple }}
      NU_ASSET: ${{ matrix.triple }}
      ARCHIVE: ${{ matrix.archive }}
      NUMAN_ASSET: ${{ matrix.numan_asset }}
      LOG_NAME: ${{ matrix.log_name }}
    steps:
      - name: Validate explicit registry checkout
        if: env.PROOF_REGISTRY_REPOSITORY != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROOF_REGISTRY_REF}" ]; then
            echo "error: registry_ref is required when registry_repository is set" >&2
            exit 1
          fi
          case "${PROOF_REGISTRY_CHECKOUT}" in
            ""|..|/*|../*|*/..|*/../*)
              echo "error: registry_checkout must be a non-empty workspace-relative path" >&2
              exit 1
              ;;
          esac
      - name: Check out registry (external)
        if: env.PROOF_REGISTRY_REPOSITORY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROOF_REGISTRY_REPOSITORY }}
          ref: ${{ env.PROOF_REGISTRY_REF }}
          path: ${{ env.PROOF_REGISTRY_CHECKOUT }}
          persist-credentials: false
      - name: Check out caller repository
        if: env.PROOF_REGISTRY_REPOSITORY == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.PROOF_REGISTRY_CHECKOUT }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install system proof dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl xz-utils git
          else
            DEBIAN_FRONTEND=noninteractive apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl xz-utils git
          fi
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.97.1
        with:
          toolchain: 1.97.1
      - name: Install proof dependencies
        working-directory: ${{ env.PROOF_REGISTRY_CHECKOUT }}
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/lifecycle-proof.txt

      - name: Check out Numan source (Windows)
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.NUMAN_REPO }}
          ref: ${{ format('v{0}', env.NUMAN_VERSION) }}
          path: _numan
          persist-credentials: false

      - name: Build Numan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: _numan
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build failed with exit code $LASTEXITCODE"
          }
          $numan = Join-Path $env:GITHUB_WORKSPACE "_numan\target\release\numan.exe"
          if (-not (Test-Path -LiteralPath $numan)) {
            throw "Numan executable not found at $numan"
          }
          $sha = (Get-FileHash -LiteralPath $numan -Algorithm SHA256).Hash.ToLowerInvariant()
          "NUMAN_PATH=$numan" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          "NUMAN_SOURCE=source-build" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          "NUMAN_ASSET_URL=" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          "NUMAN_SHA256=$sha" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          (Split-Path -Parent $numan) | Add-Content -Path $env:GITHUB_PATH -Encoding utf8
          & $numan --version

      - name: Install Nushell (Windows)
        if: runner.os == 'Windows'
        uses: hustcer/setup-nu@1b8faed9a8ff673c8ce0beae243e0b72d0787241 # v3
        with:
          version: ${{ env.NU_VERSION }}

      - name: Resolve and verify Nu (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $command = Get-Command nu -CommandType Application -ErrorAction Stop | Select-Object -First 1
          if ($null -eq $command) {
            throw "Nu was not installed by setup-nu"
          }
          $nu = $command.Source
          if ([IO.Path]::GetExtension($nu).ToLowerInvariant() -ne ".exe") {
            throw "Expected a real nu.exe on Windows, found $nu"
          }
          $version = (& $nu --version).Trim()
          if ($version -ne $env:NU_VERSION) {
            throw "Expected Nushell $env:NU_VERSION, found '$version'"
          }
          $sha = (Get-FileHash -LiteralPath $nu -Algorithm SHA256).Hash.ToLowerInvariant()
          $archiveUrl = "https://github.com/nushell/nushell/releases/download/{0}/nu-{0}-{1}.zip" -f $env:NU_VERSION, $env:NU_ASSET
          "NU_PATH=$nu" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          "NU_ARCHIVE_URL=$archiveUrl" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          "NU_ARCHIVE_SHA256=" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          "NU_SHA256=$sha" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          & $nu --version

      - name: Run lifecycle proof (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.PROOF_REGISTRY_CHECKOUT }}
        run: |
          $ErrorActionPreference = "Stop"
          $logDir = Join-Path (Get-Location) "artifacts"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $log = Join-Path $logDir $env:LOG_NAME
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function Write-Log([string]$Message) {
            Write-Host $Message
            [System.IO.File]::AppendAllText($log, $Message + "`n", $utf8)
          }
          $candidate = Join-Path (Get-Location) "registry/index.json"
          $candidateSha = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          $started = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
          $runnerImage = "$env:ImageOS $env:ImageVersion".Trim()
          if (-not $runnerImage) { $runnerImage = "windows-latest" }
          $numanVersion = (& $env:NUMAN_PATH --version).Trim()
          $nuVersion = (& $env:NU_PATH --version).Trim()
          Write-Log "package=$env:PACKAGE"
          Write-Log "package_version=$env:PACKAGE_VERSION"
          Write-Log "nu_version=$env:NU_VERSION"
          Write-Log "started_at=$started"
          Write-Log "platform=$env:TARGET_OS/$env:TARGET_ARCH"
          Write-Log "runner_image=$runnerImage"
          Write-Log "uname=$([System.Environment]::OSVersion.VersionString)"
          Write-Log "numan_version=$numanVersion"
          Write-Log "numan_source=$env:NUMAN_SOURCE"
          Write-Log "numan_asset_url=$env:NUMAN_ASSET_URL"
          Write-Log "numan_sha256=$env:NUMAN_SHA256"
          Write-Log "candidate_index_sha256=$candidateSha"
          Write-Log "nu_archive_url=$env:NU_ARCHIVE_URL"
          Write-Log "nu_archive_sha256=$env:NU_ARCHIVE_SHA256"
          Write-Log "nu_exe_sha256=$env:NU_SHA256"
          Write-Log "commands=$env:COMMANDS_JSON"
          Write-Log "command: lifecycle-prove --package $env:PACKAGE --package-version $env:PACKAGE_VERSION --candidate-index registry/index.json --commands-json $env:COMMANDS_JSON --numan $env:NUMAN_PATH --nu $env:NU_PATH"

          $output = & python scripts/lifecycle-prove.py `
            --package $env:PACKAGE `
            --package-version $env:PACKAGE_VERSION `
            --candidate-index registry/index.json `
            --commands-json $env:COMMANDS_JSON `
            --numan $env:NUMAN_PATH `
            --nu $env:NU_PATH 2>&1
          $rc = $LASTEXITCODE
          foreach ($line in $output) { Write-Log "$line" }
          $finished = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
          Write-Log "finished_at=$finished"
          Write-Log "exit_code=$rc"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "proof_exit=$rc" -Encoding utf8
          if ($rc -ne 0) {
            throw "lifecycle-prove failed for $env:PACKAGE (exit $rc)"
          }

      - name: Emit index proof record (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.PROOF_REGISTRY_CHECKOUT }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = Join-Path (Get-Location) "artifacts"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $proof = Join-Path $artifacts "proof.json"
          python scripts/lifecycle_proof_record.py `
            --log (Join-Path $artifacts $env:LOG_NAME) `
            --commands-json $env:COMMANDS_JSON `
            --output $proof `
            --package $env:PACKAGE `
            --package-version $env:PACKAGE_VERSION `
            --nu-version $env:NU_VERSION
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $proof)) {
            throw "could not emit proof record: $proof"
          }

      - name: Verify proof record (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.PROOF_REGISTRY_CHECKOUT }}
        run: |
          $ErrorActionPreference = "Stop"
          $proofPath = Join-Path (Get-Location) "artifacts/proof.json"
          if (-not (Test-Path -LiteralPath $proofPath) -or (Get-Item -LiteralPath $proofPath).Length -eq 0) {
            throw "proof record missing or empty: $proofPath"
          }
          $proof = Get-Content -LiteralPath $proofPath -Raw | ConvertFrom-Json
          $required = @("os", "arch", "nu_version", "result", "commands")
          $names = @($proof.PSObject.Properties.Name)
          foreach ($key in $required) {
            if ($names -notcontains $key) {
              throw "proof record missing ${key}: $proofPath"
            }
          }
          if ($proof.os -ne $env:TARGET_OS -or $proof.arch -ne $env:TARGET_ARCH) {
            throw "proof record is $($proof.os)/$($proof.arch), expected $env:TARGET_OS/$env:TARGET_ARCH"
          }
          if ($proof.nu_version -ne $env:NU_VERSION) {
            throw "proof record Nu version $($proof.nu_version) does not match $env:NU_VERSION"
          }
          if ($proof.result -ne "passed") {
            throw "proof record did not pass: $proofPath"
          }
          if (@($proof.commands).Count -eq 0) {
            throw "proof record has no lifecycle commands: $proofPath"
          }
          Write-Host "proof record verified: $proofPath"

      - name: Resolve Numan (release asset or source fallback)
        id: numan
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          release_base="https://github.com/${NUMAN_REPO}/releases/download/v${NUMAN_VERSION}"
          sums="${RUNNER_TEMP}/numan-SHA256SUMS"
          curl -fsSL -o "${sums}" "${release_base}/SHA256SUMS"
          asset="numan-${NUMAN_VERSION}-${NUMAN_ASSET}.tar.gz"
          source=""
          asset_url=""
          if grep -Fq "  ${asset}" "${sums}"; then
            curl -fsSL -o "${RUNNER_TEMP}/${asset}" "${release_base}/${asset}"
            expected="$(awk -v f="${asset}" '$2==f {print $1}' "${sums}")"
            actual="$(hash_file "${RUNNER_TEMP}/${asset}")"
            if [ "${actual}" != "${expected}" ]; then
              echo "Numan archive SHA mismatch: expected ${expected}, got ${actual}" >&2
              exit 1
            fi
            mkdir -p "${RUNNER_TEMP}/numan"
            tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}/numan"
            NUMAN_PATH="${RUNNER_TEMP}/numan/numan-${NUMAN_VERSION}-${NUMAN_ASSET}/numan"
            test -x "${NUMAN_PATH}"
            source="release-asset"
            asset_url="${release_base}/${asset}"
          else
            echo "No Numan release asset for ${NUMAN_ASSET}; building v${NUMAN_VERSION} from source"
            git clone --depth 1 --branch "v${NUMAN_VERSION}" "https://github.com/${NUMAN_REPO}.git" "${RUNNER_TEMP}/numan-src"
            cargo build --locked --manifest-path "${RUNNER_TEMP}/numan-src/Cargo.toml" --target-dir "${RUNNER_TEMP}/numan-build"
            NUMAN_PATH="${RUNNER_TEMP}/numan-build/debug/numan"
            test -x "${NUMAN_PATH}"
            source="source-build"
          fi
          {
            echo "NUMAN_SOURCE=${source}"
            echo "NUMAN_ASSET_URL=${asset_url}"
            echo "NUMAN_SHA256=$(hash_file "${NUMAN_PATH}")"
            echo "NUMAN_PATH=${NUMAN_PATH}"
          } >> "${GITHUB_ENV}"
          echo "numan=$("${NUMAN_PATH}" --version) source=${source}"

      - name: Download and verify Nu
        id: nu
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          archive="nu-${NU_VERSION}-${NU_ASSET}.${ARCHIVE}"
          url="https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${archive}"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "${url}"
          curl -fsSL -o "${RUNNER_TEMP}/Nu-SHA256SUMS" "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/SHA256SUMS"
          expected="$(awk -v f="${archive}" '$2==f {print $1}' "${RUNNER_TEMP}/Nu-SHA256SUMS")"
          if [ -z "${expected}" ]; then
            echo "No SHA256SUMS entry for ${archive}" >&2
            exit 1
          fi
          actual="$(hash_file "${RUNNER_TEMP}/${archive}")"
          if [ "${actual}" != "${expected}" ]; then
            echo "Nu archive SHA mismatch: expected ${expected}, got ${actual}" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/nu"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/nu"
          NU_PATH="${RUNNER_TEMP}/nu/nu-${NU_VERSION}-${NU_ASSET}/nu"
          test -x "${NU_PATH}"
          {
            echo "NU_PATH=${NU_PATH}"
            echo "NU_ARCHIVE_URL=${url}"
            echo "NU_ARCHIVE_SHA256=${actual}"
            echo "NU_SHA256=$(hash_file "${NU_PATH}")"
          } >> "${GITHUB_ENV}"
          echo "nu=${NU_VERSION} archive_sha256=${actual}"

      - name: Run lifecycle proof
        id: proof
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ env.PROOF_REGISTRY_CHECKOUT }}
        run: |
          set -euo pipefail
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          LOG="artifacts/${LOG_NAME}"
          mkdir -p artifacts
          CANDIDATE_SHA="$(hash_file registry/index.json)"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "package=${PACKAGE}"
            echo "package_version=${PACKAGE_VERSION}"
            echo "nu_version=${NU_VERSION}"
            echo "started_at=${started}"
            echo "platform=${TARGET_OS}/${TARGET_ARCH}"
            echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "uname=$(uname -a)"
            if [ "${TARGET_OS}" = "macos" ]; then sw_vers; fi
            echo "numan_version=$("${NUMAN_PATH}" --version)"
            echo "numan_source=${NUMAN_SOURCE}"
            echo "numan_asset_url=${NUMAN_ASSET_URL}"
            echo "numan_sha256=${NUMAN_SHA256}"
            echo "candidate_index_sha256=${CANDIDATE_SHA}"
            echo "nu_archive_url=${NU_ARCHIVE_URL}"
            echo "nu_archive_sha256=${NU_ARCHIVE_SHA256}"
            echo "nu_exe_sha256=${NU_SHA256}"
            echo "commands=${COMMANDS_JSON}"
            echo "command: lifecycle-prove --package ${PACKAGE} --package-version ${PACKAGE_VERSION} --candidate-index registry/index.json --commands-json ${COMMANDS_JSON} --numan ${NUMAN_PATH} --nu ${NU_PATH}"
          } | tee "${LOG}"

          set +e
          python scripts/lifecycle-prove.py \
            --package "${PACKAGE}" \
            --package-version "${PACKAGE_VERSION}" \
            --candidate-index registry/index.json \
            --commands-json "${COMMANDS_JSON}" \
            --numan "${NUMAN_PATH}" \
            --nu "${NU_PATH}" 2>&1 | tee -a "${LOG}"
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "exit_code=${rc}"
          } | tee -a "${LOG}"
          echo "proof_exit=${rc}" >> "${GITHUB_OUTPUT}"
          exit "${rc}"

      - name: Emit index proof record
        if: always() && runner.os != 'Windows'
        shell: bash
        working-directory: ${{ env.PROOF_REGISTRY_CHECKOUT }}
        run: |
          python scripts/lifecycle_proof_record.py \
            --log "artifacts/${LOG_NAME}" \
            --commands-json "${COMMANDS_JSON}" \
            --output artifacts/proof.json \
            --package "${PACKAGE}" \
            --package-version "${PACKAGE_VERSION}" \
            --nu-version "${NU_VERSION}"

      - name: Verify proof record
        if: always() && runner.os != 'Windows'
        shell: bash
        working-directory: ${{ env.PROOF_REGISTRY_CHECKOUT }}
        run: |
          set -euo pipefail
          proof="artifacts/proof.json"
          if [ ! -s "${proof}" ]; then
            echo "error: proof record missing or empty: ${proof}" >&2
            exit 1
          fi
          python - "${proof}" "${NU_VERSION}" "${TARGET_OS}" "${TARGET_ARCH}" <<'PY'
          import json
          import sys

          path, nu_version, os_name, arch = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              proof = json.load(handle)
          if not isinstance(proof, dict):
              raise SystemExit(f"error: proof record is not an object: {path}")
          missing = [key for key in ("os", "arch", "nu_version", "result", "commands") if key not in proof]
          if missing:
              raise SystemExit(f"error: proof record missing {', '.join(missing)}: {path}")
          if proof["os"] != os_name or proof["arch"] != arch:
              raise SystemExit(
                  f"error: proof record is {proof['os']}/{proof['arch']}, "
                  f"expected {os_name}/{arch}: {path}"
              )
          if proof["nu_version"] != nu_version:
              raise SystemExit(
                  f"error: proof record Nu version {proof['nu_version']!r} "
                  f"does not match {nu_version!r}: {path}"
              )
          if proof["result"] != "passed":
              raise SystemExit(f"error: proof record did not pass: {path}")
          if not isinstance(proof["commands"], list) or not proof["commands"]:
              raise SystemExit(f"error: proof record has no lifecycle commands: {path}")
          print(f"proof record verified: {path}")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ env.PROOF_ARTIFACT_PREFIX }}-${{ matrix.label }}
          path: ${{ env.PROOF_ARTIFACTS }}/
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Collect proof records
    needs: [plan, prove]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      proofs: ${{ steps.collect.outputs.proofs }}
    steps:
      - name: Validate explicit registry checkout
        if: env.PROOF_REGISTRY_REPOSITORY != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROOF_REGISTRY_REF}" ]; then
            echo "error: registry_ref is required when registry_repository is set" >&2
            exit 1
          fi
          case "${PROOF_REGISTRY_CHECKOUT}" in
            ""|..|/*|../*|*/..|*/../*)
              echo "error: registry_checkout must be a non-empty workspace-relative path" >&2
              exit 1
              ;;
          esac
      - name: Check out registry (external)
        if: env.PROOF_REGISTRY_REPOSITORY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROOF_REGISTRY_REPOSITORY }}
          ref: ${{ env.PROOF_REGISTRY_REF }}
          path: ${{ env.PROOF_REGISTRY_CHECKOUT }}
          persist-credentials: false
      - name: Check out caller repository
        if: env.PROOF_REGISTRY_REPOSITORY == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.PROOF_REGISTRY_CHECKOUT }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ env.PROOF_ARTIFACTS }}
          pattern: ${{ env.PROOF_ARTIFACT_PREFIX }}-*
      - name: Collect proof records
        id: collect
        shell: bash
        working-directory: ${{ env.PROOF_REGISTRY_CHECKOUT }}
        run: |
          set +e
          python scripts/lifecycle_proof_collect.py \
            --artifacts artifacts \
            --package "${{ needs.plan.outputs.package }}" \
            --package-version "${{ needs.plan.outputs.package_version }}" \
            --nu-version "${{ needs.plan.outputs.nu_version }}" \
            --output proofs.json \
            --summary proofs.md \
            --github-output "${GITHUB_OUTPUT}" \
            --fail-on-failure
          rc=$?
          set -e
          if [ -f proofs.md ]; then
            cat proofs.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${rc}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ env.PROOF_SUMMARY_ARTIFACT }}
          path: |
            ${{ env.PROOF_REGISTRY_CHECKOUT }}/proofs.json
            ${{ env.PROOF_REGISTRY_CHECKOUT }}/proofs.md
          if-no-files-found: warn
          retention-days: 30
