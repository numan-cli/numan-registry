name: Production registry

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for production deploy"
        required: true

permissions:
  contents: read

concurrency:
  group: registry-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate unsigned production candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography jsonschema
      - name: Run no-secret safety validation and artifact digest checks
        run: |
          python scripts/scan_for_secrets.py
          python scripts/preflight.py
          python scripts/validate.py --index registry/index.json --schema schemas/index-v1.json --skip-signature
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88
      - name: Parse candidate with Numan's production parser
        run: cargo run --locked --manifest-path tools/numan-parser-check/Cargo.toml -- registry/index.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: numan-cli/numan-plugins
          ref: eb435983cfd8bed568a3c275ba6518607e904e89 # merged numan-plugins PR #3
          path: numan-plugins
          persist-credentials: false
          sparse-checkout: manifest.json
      - name: Lint manifest and index
        run: |
          python scripts/test_lint_manifest_index.py
          python scripts/lint-manifest-index.py --index registry/index.json --manifest numan-plugins/manifest.json

  sign-and-publish:
    name: Sign and publish production registry
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # Required only for actions-gh-pages to publish the signed registry.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography jsonschema
      - name: Guard against debug tracing and require signing secret
        shell: bash
        env:
          STEP_DEBUG_SECRET: ${{ secrets.ACTIONS_STEP_DEBUG }}
          RUNNER_DEBUG_SECRET: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
          NUMAN_REGISTRY_PRIVATE_KEY: ${{ secrets.NUMAN_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ "${RUNNER_DEBUG:-}" = "1" ] || [ "${STEP_DEBUG_SECRET:-}" = "true" ] || [ "${RUNNER_DEBUG_SECRET:-}" = "true" ]; then
            echo "FAIL: debug logging is enabled; disable it before production signing"
            exit 1
          fi
          if [ -z "${NUMAN_REGISTRY_PRIVATE_KEY}" ]; then
            echo "FAIL: NUMAN_REGISTRY_PRIVATE_KEY is not set in the production environment"
            exit 1
          fi
      - name: Read production key id
        id: key_id
        shell: bash
        run: |
          KEY_ID=$(python -c "import json; print(json.load(open('keys/official.pub'))['key_id'])")
          if [[ ! "${KEY_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || [ "${KEY_ID}" = "official-placeholder" ]; then
            echo "FAIL: keys/official.pub contains an invalid production key id"
            exit 1
          fi
          echo "key_id=${KEY_ID}" >> "$GITHUB_OUTPUT"
      - name: Sign and validate production registry
        shell: bash
        env:
          NUMAN_REGISTRY_PRIVATE_KEY: ${{ secrets.NUMAN_REGISTRY_PRIVATE_KEY }}
          PRODUCTION_KEY_ID: ${{ steps.key_id.outputs.key_id }}
        run: |
          if [[ ! "${PRODUCTION_KEY_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "FAIL: production key id has an invalid format"
            exit 1
          fi
          python scripts/ci-sign.py --index registry/index.json --sig registry/index.json.sig --key-id "${PRODUCTION_KEY_ID}" --priv-b64 "${NUMAN_REGISTRY_PRIVATE_KEY}"
          python scripts/validate.py --index registry/index.json --sig registry/index.json.sig --pub keys/official.pub --schema schemas/index-v1.json
      - name: Record public site publication metadata
        run: python scripts/write_site_metadata.py --environment production
      - uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./registry
          destination_dir: ""
          # Preserve gh-pages/staging published by staging.yml.
          # Removals from the production index require manual gh-pages cleanup.
          keep_files: true
