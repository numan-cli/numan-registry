name: Repository safety

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-repo-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-tests:
    name: Script tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography jsonschema coverage==7.15.4 PyYAML==6.0.3
      - name: Run Python unit tests
        run: |
          python -m coverage run -m unittest discover -s scripts -p "test_*.py" -v
          python -m coverage report -m
      - name: Append coverage to job summary
        if: runner.os == 'Linux'
        run: python -m coverage report -m >> "$GITHUB_STEP_SUMMARY"
      - name: Catalog compat doc matches index
        run: python scripts/render_catalog_compat.py --check

  secret-scan:
    name: Scan for probable private-key material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/scan_for_secrets.py

  preflight:
    name: Key and workflow preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/preflight.py

  numan-parser:
    name: Parse catalog with Numan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88
      - run: >-
          cargo run --locked
          --manifest-path tools/numan-parser-check/Cargo.toml
          -- registry/index.json

  manifest-index-lint:
    name: Lint manifest vs index Nu constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: numan-cli/numan-plugins
          ref: eb435983cfd8bed568a3c275ba6518607e904e89 # merged numan-plugins PR #3
          path: numan-plugins
          persist-credentials: false
          sparse-checkout: manifest.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/test_lint_manifest_index.py
      - run: >-
          python scripts/lint-manifest-index.py
          --index registry/index.json
          --manifest numan-plugins/manifest.json

  package-lint:
    name: Lint package entries (Stage 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/test_lint_packages.py
      - run: python scripts/lint_packages.py --index registry/index.json

  workflow-lint:
    name: Workflow validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/check_workflows.py
      - run: python -m unittest discover -s scripts -p test_check_workflows.py -v
      - name: Validate GitHub Actions workflows
        if: ${{ !cancelled() }}
        run: |
          mapfile -t workflows < <(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')
          go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca "${workflows[@]}"
